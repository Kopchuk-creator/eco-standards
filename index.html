<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Екологічні стандарти</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Довідкова система «Екологічні стандарти»</h1>
  <form id="check">
    <label>Рік випуску авто <input name="year" type="number"></label>
    <label>CO, г/км <input name="co" type="number" step="0.01"></label>
    <label>NOx, г/км <input name="nox" type="number" step="0.01"></label>
    <button>Перевірити</button>
  </form>
  <p id="result"></p>
  <script src="app.js"></script>
</body>
</html>
